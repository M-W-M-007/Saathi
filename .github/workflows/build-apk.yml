name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Pinned on purpose: the ubuntu-latest label moved to Ubuntu 26 on
    # 19 Oct 2026 and the Android setup action broke on the new image.
    runs-on: ubuntu-24.04

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android is deliberately absent: GitHub runners
      # already ship the Android SDK with ANDROID_SDK_ROOT set, and that action
      # was the step that kept failing.

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

          # --stacktrace is gone on purpose. It buried every real error under a
          # few hundred lines of Gradle internals, and GitHub then truncated the
          # log so the actual message could not be read at all.
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || true

      # The errors that matter, printed on the run summary page where they are
      # short, always visible, and never truncated.
      - name: Errors (summary)
        if: always()
        run: |
          {
            echo "## Build errors"
            echo ''
            echo '```'
            grep -E "^e: |^w: .*error|error:|FAILURE:|What went wrong|Caused by:" build.log \
              | grep -v "org.gradle" | head -60 || echo "(koi error line nahi mili)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK bana ya nahi
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: APK upload karein
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
